<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIM Manager Trivia</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>

    <!-- Upload & Extraction Screen -->
    <section id="upload-view" class="view-container active">
        <div class="upload-card pill-shape">
            <h1>BIM Manager Training</h1>
            <p>Upload a standard or guideline PDF to generate your session.</p>
            <input type="file" id="pdf-upload" accept="application/pdf">
            <input type="number" id="question-count" value="20" min="5" max="50">
            <button id="start-btn" class="gold-btn">Generate Questions</button>
            <div id="progress-container" class="hidden">
                <div class="progress-bar-bg"><div id="progress-bar-fill"></div></div>
                <p id="progress-text">0% - Awaiting upload...</p>
            </div>
        </div>
    </section>

    <!-- Main Game Interface -->
    <section id="game-view" class="view-container hidden">
        <header class="game-header">
            <div class="digital-display timer-display">
                ⏱ TIME: <span id="time-left">10</span>s
            </div>
            <div class="digital-display score-display">
                🏆 SCORE: <span id="current-score">0000</span> PTS
            </div>
        </header>

        <main class="trivia-board">
            <h2 id="question-tracker">QUESTION 1 / 20</h2>
            <div class="question-pill">
                <span class="ornament">?</span>
                <p id="question-text">Loading question...</p>
                <span class="ornament">?</span>
            </div>

            <div class="options-grid">
                <button class="option-pill" data-option="A"><span class="opt-label">A:</span> <span class="opt-text"></span></button>
                <button class="option-pill" data-option="B"><span class="opt-label">B:</span> <span class="opt-text"></span></button>
                <button class="option-pill" data-option="C"><span class="opt-label">C:</span> <span class="opt-text"></span></button>
                <button class="option-pill" data-option="D"><span class="opt-label">D:</span> <span class="opt-text"></span></button>
            </div>
        </main>

        <!-- Feedback Drawer -->
        <aside id="feedback-drawer" class="drawer-hidden">
            <div class="drawer-header">
                <h3>EXPLANATION & REAL-WORLD SCENARIO</h3>
                <button id="close-drawer-btn">✕</button>
            </div>
            <div class="drawer-content" id="explanation-content">
                <!-- AI Explanation injected here -->
            </div>
            <div class="drawer-footer">
                <button id="next-question-btn" class="gold-btn">NEXT QUESTION</button>
            </div>
        </aside>
    </section>

    <!-- Result and Retake -->
    <section id="results-view" class="view-container hidden">
        <div class="upload-card pill-shape" style="text-align: center;">
            <h1>Session Complete!</h1>
            <p>Your final active-recall score:</p>
            <h2 id="final-score-display" style="color: var(--gold-accent); font-size: 3.5rem; margin: 1rem 0;">0 PTS</h2>
            
            <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 2rem;">
                <button id="retake-btn" class="gold-btn">Retake Test</button>
                <button id="new-pdf-btn" class="gold-btn" style="background-color: transparent; border: 1px solid var(--gold-accent);">Upload New PDF</button>
            </div>
        </div>
    </section>
    
    <!-- Logic Scripts -->
    <script src="js/engine.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
